<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main-container">
        <div class="titel-info">
            <h1 class="titel">Tasko</h1>
            <p class="subtitel">Turn your daily chaos into structured progress.</p>
        </div>

        <div class="add-task">
            <input type="text" id="task" placeholder="Your new task">
            <div class="button-div">
                <button class="add-button" onclick="addTask()">Add Task</button>
            </div>
        </div>

        <div class="display-task">
            
        </div>
    </main>


    <script src="script.js"></script>
</body>

</html>
